<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>과학송 경연대회 심사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #F1F4F9;
  --card: #FFFFFF;
  --ink: #17233F;
  --ink-2: #56627C;
  --line: #D3DAE7;
  --brand: #2848C7;
  --brand-ink: #FFFFFF;
  --lv0: #0B8A72;   /* 매우 우수 */
  --lv1: #2C6FD4;   /* 우수 */
  --lv2: #C2860A;   /* 보통 */
  --lv3: #B8503D;   /* 노력 필요 */
  --gold: #F3B824;
  --silver: #B4BFD2;
  --warn-bg: #FFF4D6;
  --warn-ink: #6B4B00;
  --stage: #0D1736;
  --body: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", "Noto Sans CJK KR", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.55 var(--body); word-break: keep-all; overflow-wrap: anywhere;
}
h1, h2, h3, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* 공통 틀 */
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }
.wrap.wide { max-width: 1180px; padding-bottom: 64px; }
.top {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap;
  padding: 22px 0 16px;
}
.top h1 { font-size: 1.375rem; line-height: 1.3; font-weight: 700; }
.top p { color: var(--ink-2); font-size: .9375rem; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--card); font-weight: 600;
}
a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); padding: 0 10px; }
.demo-note {
  background: var(--warn-bg); color: var(--warn-ink); padding: 10px 16px; font-size: .9375rem; text-align: center;
}
.alert {
  background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: .9375rem;
}
.alert.err { background: #FDE7E2; color: #7A2414; }

/* 들어가기 */
.gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: min(420px, 100%); }
.gate-title, .award .place, .s-grade, .s-label, .s-title, .s-board .g { font-family: var(--display); font-weight: 900; font-synthesis: none; }
.gate-title { font-size: clamp(2.25rem, 9vw, 3.25rem); line-height: 1.12; letter-spacing: -.01em; }
.staff { height: 33.5px; margin: 18px 0 26px; background: repeating-linear-gradient(to bottom, var(--ink) 0 1.5px, transparent 1.5px 8px); opacity: .85; position: relative; }
.staff i { position: absolute; width: 13px; height: 10px; border-radius: 50%; background: var(--brand); transform: rotate(-18deg); }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-weight: 600; margin-bottom: 6px; }
.field input, .field textarea, .field select {
  width: 100%; min-height: 50px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card);
}
.field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.gate .btn.primary { width: 100%; min-height: 54px; font-size: 1.0625rem; margin-top: 6px; }
.gate-foot { margin-top: 18px; font-size: .9375rem; color: var(--ink-2); }
.gate-foot a { color: var(--brand); }

/* 팀 목록 */
.grades { display: flex; gap: 6px; border-bottom: 1.5px solid var(--line); margin-bottom: 6px; }
.grades button {
  flex: 1; min-height: 52px; border: 0; background: none; font-weight: 600; color: var(--ink-2);
  border-bottom: 3px solid transparent; margin-bottom: -1.5px; border-radius: 6px 6px 0 0;
}
.grades button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.grades button small { display: block; font-weight: 400; font-size: .8125rem; }
.setlist { list-style: none; margin: 0; padding: 0; }
.setlist li + li { border-top: 1px solid var(--line); }
.team {
  width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
  padding: 14px 4px; border: 0; background: none; text-align: left; min-height: 68px;
}
.team:hover { background: #E8EDF6; }
.no {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
  border: 1.5px solid var(--ink); font-weight: 700; font-variant-numeric: tabular-nums;
}
.team b { display: block; font-weight: 600; line-height: 1.35; }
.team small { color: var(--ink-2); font-size: .875rem; }
.st { font-size: .875rem; color: var(--ink-2); white-space: nowrap; text-align: right; }
.st.done { color: var(--lv0); font-weight: 700; }
.st.done b { display: inline; font-size: 1.25rem; }
.st.draft, .st.editing { color: var(--lv2); font-weight: 600; }
.empty { padding: 40px 8px; color: var(--ink-2); text-align: center; }
.all-done { margin-top: 14px; color: var(--lv0); font-weight: 600; }

/* 채점 */
.score-top { align-items: center; flex-wrap: nowrap; justify-content: flex-start; padding-bottom: 12px; }
.score-top .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.crit { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1.5px solid transparent; }
.crit.missing { border-color: var(--lv3); }
.crit-head { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; margin-bottom: 12px; }
.crit-head h3 { font-size: 1.125rem; font-weight: 700; }
.crit-head .ask { grid-column: 1; color: var(--ink-2); font-size: .9375rem; }
.pts { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 1rem; color: var(--ink-2); white-space: nowrap; }
.pts b { font-size: 1.875rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.levels { display: grid; gap: 6px; }
.lv {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; width: 100%;
  padding: 10px 12px 10px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card);
  border-left: 6px solid var(--c); min-height: 48px;
}
.lv0 { --c: var(--lv0); } .lv1 { --c: var(--lv1); } .lv2 { --c: var(--lv2); } .lv3 { --c: var(--lv3); }
.lv-name { font-weight: 700; }
.lv-band { color: var(--ink-2); font-size: .875rem; font-variant-numeric: tabular-nums; }
.lv-desc { grid-column: 1 / -1; font-size: .9375rem; line-height: 1.5; color: var(--ink-2); }
.lv[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 9%, white); }
.lv[aria-pressed="true"] .lv-name { color: var(--c); }
.lv[aria-pressed="true"] .lv-desc { color: var(--ink); }
.crit.picked .lv[aria-pressed="false"] .lv-desc { display: none; }
.tune { display: grid; grid-template-columns: 48px 1fr 48px; gap: 12px; align-items: center; margin-top: 14px; }
.step { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); font-size: 1.5rem; line-height: 1; font-weight: 500; }
.step[disabled] { opacity: .4; cursor: default; }
.meter { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 7px; background: var(--bands); margin: 0; cursor: pointer; }
.meter::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); border: 4px solid #fff; box-shadow: 0 0 0 1.5px var(--ink); }
.meter::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 4px solid #fff; box-shadow: 0 0 0 1.5px var(--ink); }
.meter.unset::-webkit-slider-thumb { background: #fff; border-color: #fff; box-shadow: 0 0 0 1.5px var(--ink-2); }
.meter.unset::-moz-range-thumb { background: #fff; box-shadow: 0 0 0 1.5px var(--ink-2); }
.tune-hint { grid-column: 1 / -1; text-align: center; font-size: .8125rem; color: var(--ink-2); margin-top: -4px; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: #fff;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 5;
}
.bar-in { max-width: 688px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.sum span { font-size: .875rem; opacity: .75; margin-right: 8px; }
.sum b { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.sum i { font-style: normal; opacity: .75; }
.bar .btn.primary { min-height: 50px; padding: 0 22px; background: var(--gold); border-color: var(--gold); color: var(--ink); font-size: 1.0625rem; }
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--lv0); color: #fff;
  padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); text-align: center;
}

/* 채점 기준표 */
dialog.sheet { width: min(1040px, calc(100% - 16px)); max-height: calc(100dvh - 16px); border: 0; border-radius: 14px; padding: 0; color: var(--ink); }
dialog.sheet::backdrop { background: rgba(13, 23, 54, .6); }
.sheet-head { position: sticky; top: 0; background: var(--card); display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet-head h2 { font-size: 1.125rem; }
.sheet-body { padding: 14px 18px 20px; }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
.rubric { min-width: 820px; font-size: .9375rem; }
.rubric th, .rubric td { border: 1px solid var(--line); padding: 9px 10px; vertical-align: top; text-align: left; line-height: 1.5; }
.rubric thead th { color: #fff; text-align: center; }
.rubric thead th:first-child { background: var(--ink); }
.rubric .h0 { background: var(--lv0); } .rubric .h1 { background: var(--lv1); } .rubric .h2 { background: var(--lv2); } .rubric .h3 { background: var(--lv3); }
.rubric tbody th { width: 150px; background: #F5F7FB; }
.rubric tbody th small { display: block; font-weight: 400; color: var(--ink-2); }
.rubric td b { display: block; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.notes { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); font-size: .9375rem; }

/* 결과 */
.grade-block { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 18px; }
.grade-block h2 { font-size: 1.375rem; }
.grade-meta { color: var(--ink-2); font-size: .9375rem; margin-bottom: 14px; }
.podium { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; margin-bottom: 14px; }
.award { border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 14px; align-items: center; }
.award.first { background: #FCEBB0; }
.award.second { background: #E4EAF4; }
.award .place { grid-row: span 2; font-size: 1.75rem; line-height: 1; }
.award b { font-size: 1.125rem; line-height: 1.35; }
.award small { grid-column: 2; color: var(--ink-2); }
.award .avg { grid-row: 1 / span 2; grid-column: 3; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.rank th, .rank td, .matrix th, .matrix td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank th, .matrix th { font-size: .8125rem; font-weight: 600; color: var(--ink-2); border-bottom: 1.5px solid var(--ink); vertical-align: bottom; }
.rank th small { display: block; font-weight: 400; }
.rank .l, .matrix .l { text-align: left; white-space: normal; }
.rank td.title b { display: block; font-weight: 600; }
.rank td.title small { color: var(--ink-2); }
.rank .total { font-weight: 700; font-size: 1.0625rem; }
.rank tr.r1 td { background: #FEF6DA; }
.rank tr.r2 td { background: #F1F4FA; }
.rank tr.none td { color: var(--ink-2); }
.rank tbody tr.row { cursor: pointer; }
.rank tbody tr.row:hover td { box-shadow: inset 0 -2px 0 var(--brand); }
.rank tr.detail td { background: #F7F9FC; white-space: normal; text-align: left; padding: 10px 14px 14px; }
.tag { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); margin-left: 6px; vertical-align: 2px; }
.mini { width: auto; font-size: .875rem; }
.mini th, .mini td { padding: 4px 12px 4px 0; text-align: right; border: 0; font-variant-numeric: tabular-nums; }
.mini th { font-weight: 600; color: var(--ink-2); }
.mini .l { text-align: left; white-space: normal; }
.sub { margin: 22px 0 8px; font-size: 1rem; }
.auto { display: inline-flex; align-items: center; gap: 6px; font-size: .9375rem; color: var(--ink-2); min-height: 44px; }
.print-only { display: none; }

/* 팀 편집 */
.wrap.wide.manage { padding-bottom: 120px; }
.set-grid { display: grid; grid-template-columns: 1.1fr .9fr 1.6fr; gap: 0 16px; margin-top: 12px; }
.set-grid .field { margin-bottom: 0; }
.set-grid input[readonly] { background: var(--paper); color: var(--ink-2); }
.m-list { list-style: none; margin: 0; padding: 0; }
.m-team { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.m-team .no { margin-top: 2px; }
.m-fields input { min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); }
.m-title { width: 100%; font-weight: 600; }
.m-members { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.m-mem { width: 9em; }
.m-note { font-size: .875rem; color: var(--warn-ink); margin-top: 6px; }
.m-ops { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 300px; }
.step.sm { width: 44px; height: 44px; font-size: 1.125rem; }
.m-del.sure { color: #7A2414; border-color: #7A2414; text-align: left; min-height: 44px; height: auto; padding: 6px 12px; }
.m-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.manage-bar .bar-in { max-width: 1148px; }
.manage-bar #mState { font-size: .9375rem; }
.bar-btns { display: flex; gap: 8px; align-items: center; }
.bar .btn.quiet { color: #fff; }
dialog.sheet.narrow { width: min(620px, calc(100% - 16px)); }
.p-help { margin-bottom: 14px; color: var(--ink-2); }

/* 종이 점수 넣기 */
.wrap.wide.paper { padding-bottom: 120px; }
.paper-judge { display: grid; grid-template-columns: minmax(0, 320px) 1fr; gap: 8px 20px; align-items: end; }
.paper-judge .field { margin-bottom: 0; }
.paper-judge p { color: var(--ink-2); font-size: .9375rem; padding-bottom: 4px; }
.entry { min-width: 900px; }
.entry th, .entry td { padding: 6px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.entry th { font-size: .8125rem; font-weight: 600; color: var(--ink-2); border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.entry th small { display: block; font-weight: 400; }
.entry .l { text-align: left; }
.entry td.title { min-width: 11em; }
.entry td.title b { display: block; font-weight: 600; line-height: 1.35; }
.entry td.title small { color: var(--ink-2); font-size: .875rem; }
.entry .no { margin: 0 auto; }
.entry input { min-height: 44px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); padding: 6px 8px; }
.entry input.sc { width: 3.6em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 1.0625rem; }
.entry input.cm { width: 100%; min-width: 11em; }
.entry input.bad { border-color: var(--lv3); background: #FDE7E2; }
.entry .tot { font-weight: 700; font-size: 1.0625rem; min-width: 3em; }
.entry .state { font-size: .8125rem; white-space: nowrap; color: var(--ink-2); min-width: 7.5em; }
.entry tr.changed .state { color: var(--lv2); font-weight: 600; }
.entry tr.saved .state { color: var(--lv0); font-weight: 600; }
.entry tr.wrong .state { color: var(--lv3); font-weight: 600; }
.entry-hint { margin-top: 12px; color: var(--ink-2); font-size: .875rem; }
.paper-bar .bar-in { max-width: 1148px; }
.paper-bar #pState { font-size: .9375rem; }
@media (max-width: 640px) { .paper-judge { grid-template-columns: 1fr; } }

/* 지난 대회 고르기, 새 대회 시작 */
.year-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-weight: 600; }
.pick-year { min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 600; max-width: 100%; }
.set-more { display: flex; gap: 10px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.set-more p { flex: 1 1 320px; color: var(--ink-2); font-size: .9375rem; }
.check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 3px 0 0; flex: none; }
.check small { display: block; color: var(--ink-2); }
.checks { display: flex; gap: 6px 22px; flex-wrap: wrap; border: 0; padding: 0; margin: 0 0 14px; }
.checks legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
.checks .check { margin-bottom: 0; align-items: center; }
.checks .check input { margin: 0; }
.btn.sure { background: #7A2414; border-color: #7A2414; color: #fff; }

/* 종이 채점표 (인쇄할 때만 보임, A4 가로, 흑백) */
#printArea { display: none; }
.sheet-page { color: #000; font-size: 9.5pt; line-height: 1.3; }
.sp-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 8mm; margin-bottom: 2.5mm; }
.sp-head h1 { font-size: 14pt; font-weight: 700; line-height: 1.2; }
.sp-head h1 b { font-size: 18pt; margin: 0 1mm; }
.sp-head h1 small { font-size: 10pt; font-weight: 400; margin-left: 2mm; }
.sp-judge { font-size: 11pt; white-space: nowrap; }
.sp-judge span { display: inline-block; min-width: 42mm; min-height: 6.5mm; border-bottom: .4mm solid #000; margin: 0 5mm 0 2mm; padding: 0 2mm; font-weight: 700; text-align: center; vertical-align: bottom; }
.sp-judge span:last-child { margin-right: 0; }
table.sp { table-layout: fixed; border: .5mm solid #000; }
.sp col.c-no { width: 11mm; }
.sp col.c-title { width: 66mm; }
.sp col.c-sc { width: 23mm; }
.sp th, .sp td { border: .25mm solid #000; padding: .8mm 1.5mm; text-align: center; vertical-align: middle; }
.sp thead th { background: #E6E6E6; font-weight: 700; font-size: 9pt; line-height: 1.25; }
.sp thead th b { display: block; font-size: 10pt; }
.sp tr.band th { text-align: right; font-weight: 500; font-size: 8pt; padding: .3mm 2mm; background: #F3F3F3; }
.sp tr.band td { font-size: 8pt; padding: .3mm 1mm; font-variant-numeric: tabular-nums; }
.sp tr.band td[rowspan] { font-size: 7.5pt; color: #444; }
.sp tbody td { height: var(--row, 12mm); padding-top: .3mm; padding-bottom: .3mm; }
.sp tbody tr:first-child td { border-top: .5mm solid #000; }
.sp td.sp-no { font-weight: 700; font-size: 11pt; }
.sp td.t { text-align: left; }
.sp td.t b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 9.5pt; line-height: 1.2; }
.sp td.t small { display: block; font-size: 8pt; line-height: 1.2; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tight .sp td.t b { -webkit-line-clamp: 1; }
.sp td.sum { background: #F3F3F3; }
.sp-notes { margin: 2mm 0 0; padding-left: 4.5mm; font-size: 8pt; line-height: 1.4; color: #222; }
@media print {
  body.print-sheet #app, body.print-sheet dialog, body.print-sheet .toast { display: none !important; }
  body.print-sheet #printArea { display: block; }
  .sheet-page { break-after: page; }

/**
 * 심사 집계. 채점 페이지(브라우저)와 Apps Script 서버가 같은 코드를 씁니다.
 * roster:  [{id, grade, order, members, title}]
 * records: [{team(팀 ID), judge, scores:[정수 5개], comment, at}]
 * 팀 점수 = 그 팀을 채점한 사람들의 총점 평균.
 * 동점 = 과학 개념 정확성(첫 항목) 평균 -> 창의성과 독창성(둘째 항목) 평균 -> 공동 순위.
 */
function aggregate(roster, records, criteria) {
  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  // 팀은 고유 ID로 찾고, ID가 없는 옛 자료만 학년-순서로 찾는다
  function has(v) { return v != null && String(v) !== ''; }
  function teamKey(t) { return has(t.id) ? String(t.id) : Number(t.grade) + '-' + Number(t.order); }
  function recKey(r) { return has(r.team) ? String(r.team) : Number(r.grade) + '-' + Number(r.order); }
  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  // 분수 a.s/a.n 과 b.s/b.n 을 정수 곱으로 비교 (반올림 오차 없음)
  function frac(as, an, bs, bn) { return bs * an - as * bn; }

  var teams = {}, order = [];
  roster.forEach(function (t) {
    var k = teamKey(t);
    if (teams[k]) return;
    teams[k] = { key: k, id: k, grade: Number(t.grade), order: Number(t.order), members: norm(t.members),
      title: norm(t.title), judgeMap: {} };
    order.push(k);
  });

  var orphans = 0, judgeStat = {};
  records.forEach(function (r, idx) {
    var t = teams[recKey(r)], name = norm(r.judge);
    if (!t || !name) { orphans++; return; }
    var scores = criteria.map(function (c, i) { return Number(r.scores[i]) || 0; });
    var cur = { judge: name, scores: scores, total: sum(scores), comment: norm(r.comment),
      at: String(r.at || ''), idx: idx };
    var prev = t.judgeMap[name];
    if (!prev || cur.at > prev.at || (cur.at === prev.at && cur.idx > prev.idx)) t.judgeMap[name] = cur;
  });

  var grades = {};
  order.forEach(function (k) {
    var t = teams[k];
    var js = Object.keys(t.judgeMap).sort().map(function (n) { return t.judgeMap[n]; });
    js.forEach(function (j) {
      delete j.idx;
      var st = judgeStat[j.judge] || (judgeStat[j.judge] = { judge: j.judge, counts: {}, total: 0 });
      st.counts[t.grade] = (st.counts[t.grade] || 0) + 1; st.total++;
    });
    delete t.judgeMap;
    t.judges = js; t.n = js.length;
    t.critSum = criteria.map(function (c, i) { return sum(js.map(function (j) { return j.scores[i]; })); });
    t.totalSum = sum(t.critSum);
    t.critAvg = t.n ? t.critSum.map(function (s) { return s / t.n; }) : criteria.map(function () { return null; });
    t.totalAvg = t.n ? t.totalSum / t.n : null;
    t.rank = null; t.award = ''; t.fewJudges = false;
    var g = grades[t.grade] || (grades[t.grade] = { grade: t.grade, teams: [], maxJudges: 0, hasTie: false, scored: 0 });
    g.teams.push(t);
  });

  function cmp(a, b) {
    return frac(a.totalSum, a.n, b.totalSum, b.n) ||
      frac(a.critSum[0], a.n, b.critSum[0], b.n) ||
      frac(a.critSum[1], a.n, b.critSum[1], b.n);
  }

  Object.keys(grades).forEach(function (gk) {
    var g = grades[gk];
    var ranked = g.teams.filter(function (t) { return t.n > 0; });
    var rest = g.teams.filter(function (t) { return t.n === 0; });
    ranked.sort(function (a, b) { return cmp(a, b) || a.order - b.order; });
    rest.sort(function (a, b) { return a.order - b.order; });
    g.scored = ranked.length;
    ranked.forEach(function (t, i) {
      t.rank = (i > 0 && cmp(ranked[i - 1], t) === 0) ? ranked[i - 1].rank : i + 1;
      if (t.n > g.maxJudges) g.maxJudges = t.n;
    });
    var count = {};
    ranked.forEach(function (t) { count[t.rank] = (count[t.rank] || 0) + 1; });
    ranked.forEach(function (t) {
      t.fewJudges = t.n < g.maxJudges;
      t.tied = count[t.rank] > 1;
      if (t.rank <= 2) t.award = (t.tied ? '공동 ' : '') + t.rank + '등';
      if (t.tied && t.rank <= 2) g.hasTie = true;
    });
    g.teams = ranked.concat(rest);
  });

  var judges = Object.keys(judgeStat).sort().map(function (n) { return judgeStat[n]; });
  return { grades: grades, judges: judges, orphans: orphans };

/* ---------- 서버 통신 ---------- */

async function api(action, data) {
  if (GAS) return gasApi(action, data || {});
  if (!API_URL) return demoApi(action, data || {});
  const payload = Object.assign({ action }, data);
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    return jsonp(action, data);   // 일부 환경에서 fetch 가 막히면 같은 요청을 스크립트 방식으로 다시 보냅니다
  }
}

function gasApi(action, data) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(text => { try { resolve(JSON.parse(text)); } catch (e) { reject(new Error('심사 서버의 응답을 읽지 못했습니다. 다시 해 주세요.')); } })
      .withFailureHandler(err => reject(new Error('심사 서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 해 주세요.' + (err && err.message ? ' (' + err.message + ')' : ''))))
      .api(JSON.stringify(Object.assign({ action }, data)));
  });
}

function jsonp(action, data) {
  return new Promise((resolve, reject) => {
    const cb = 'ssj_' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    const s = document.createElement('script');
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const fail = () => { done(); reject(new Error('심사 서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 해 주세요.')); };
    const timer = setTimeout(fail, 20000);
    window[cb] = out => { done(); resolve(out); };
    s.onerror = fail;
    s.src = API_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cb + '&payload=' + encodeURIComponent(JSON.stringify(data || {}));
    document.head.appendChild(s);
  });
}

const demoRoster = () => store.get('ssj.demo.roster', DEMO.roster);
function demoApi(action, d) {
  return new Promise(resolve => setTimeout(() => {
    const recs = store.get('ssj.demo.records', []), cfg = demoCfg(), roster = demoRoster();
    const bad = msg => resolve({ ok: false, code: 'BAD_CODE', error: msg });
    const code = String(d.code == null ? '' : d.code).trim();
    if (action === 'roster') {
      if (code !== cfg.judgeCode) return bad('심사 코드가 맞지 않습니다.');
      return resolve({ ok: true, title: cfg.title, roster, mine: recs.filter(r => r.judge === cleanName(d.judge)) });
    }
    if (action === 'submit') {
      if (code !== cfg.judgeCode) return bad('심사 코드가 맞지 않습니다.');
      const t = roster.find(x => x.id === d.team);
      if (!t) return resolve({ ok: false, code: 'NO_TEAM', error: '순서표에 없는 팀입니다. 화면을 새로 고친 뒤 다시 해 주세요.' });
      const rec = { team: t.id, grade: t.grade, order: t.order, judge: cleanName(d.judge), scores: d.scores.map(Number), comment: String(d.comment || '').trim(), at: new Date().toISOString() };
      const i = recs.findIndex(r => recKey(r) === rec.team && r.judge === rec.judge);
      if (i >= 0) recs[i] = rec; else recs.push(rec);
      store.set('ssj.demo.records', recs);
      return resolve({ ok: true, updated: i >= 0, record: rec });
    }
    if (action === 'results' || action === 'saveRoster' || action === 'submitBatch' || action === 'archive') {
      if (code !== DEMO.adminCode) return bad('관리자 코드가 맞지 않습니다.');
      const olds = store.get('ssj.demo.archives', []);
      const brief = () => olds.map(a => ({ label: a.label, title: a.title, at: a.at, teams: a.roster.length, records: a.records.length })).reverse();
      if (action === 'results') {
        const now = { ok: true, title: cfg.title, judgeCode: cfg.judgeCode, archives: brief(), roster, records: recs, at: new Date().toISOString() };
        if (!d.archive) return resolve(now);
        const a = olds.find(x => x.label === d.archive);
        if (!a) return resolve({ ok: false, code: 'NO_ARCHIVE', error: '보관된 대회를 찾지 못했습니다: ' + d.archive });
        return resolve(Object.assign(now, { archive: a.label, title: a.title, roster: a.roster, records: a.records, at: a.at }));
      }
      if (action === 'submitBatch') {
        const judge = cleanName(d.judge), at = new Date().toISOString(), fresh = [];
        for (const it of d.items) {
          const t = roster.find(x => x.id === it.team);
          if (!t) return resolve({ ok: false, code: 'NO_TEAM', error: '순서표에 없는 팀이 있습니다. 화면을 새로 고친 뒤 다시 해 주세요.' });
          fresh.push({ team: t.id, grade: t.grade, order: t.order, judge, scores: it.scores.map(Number), comment: String(it.comment || '').trim(), at });
        }
        fresh.forEach(rec => { const i = recs.findIndex(r => recKey(r) === rec.team && r.judge === rec.judge); if (i >= 0) recs[i] = rec; else recs.push(rec); });
        store.set('ssj.demo.records', recs);
        return resolve({ ok: true, saved: fresh.length, records: fresh });
      }
      if (action === 'archive') {
        const label = String(d.label || '').replace(/\s+/g, ' ').trim();
        if (!/^[0-9A-Za-z가-힣 _-]{1,20}$/.test(label)) return resolve({ ok: false, code: 'BAD_ARCHIVE', error: '보관 이름은 한글, 영문, 숫자로 20자까지 적어 주세요.' });
        if (olds.some(a => a.label === label)) return resolve({ ok: false, code: 'DUP_ARCHIVE', error: '"' + label + '" 이라는 보관이 이미 있습니다. 다른 이름을 적어 주세요.' });
        if (!roster.length && !recs.length) return resolve({ ok: false, code: 'NOTHING', error: '보관할 팀이나 점수가 없습니다.' });
        const at = new Date().toISOString(), title = String(d.newTitle == null ? cfg.title : d.newTitle).trim() || cfg.title, next = d.keepRoster ? roster : [];
        olds.push({ label, title: cfg.title, at, roster, records: recs });
        store.set('ssj.demo.archives', olds); store.set('ssj.demo.roster', next); store.set('ssj.demo.records', []);
        store.set('ssj.demo.config', { title, judgeCode: cfg.judgeCode });
        return resolve({ ok: true, label, title, judgeCode: cfg.judgeCode, roster: next, records: [], archives: brief(), at });
      }
      if (d.judgeCode === DEMO.adminCode) return resolve({ ok: false, code: 'BAD_CONFIG', error: '심사 코드는 관리자 코드와 달라야 합니다.' });
      const seen = {}, count = {};
      const next = d.roster.map(t => {
        let id = t.id;
        while (!id || seen[id]) id = 't' + Math.random().toString(36).slice(2, 8);
        seen[id] = true; count[t.grade] = (count[t.grade] || 0) + 1;
        return { id, grade: t.grade, order: count[t.grade], members: t.members, title: t.title };
      }).sort((x, y) => x.grade - y.grade || x.order - y.order);
      store.set('ssj.demo.roster', next); store.set('ssj.demo.config', { title: d.title, judgeCode: d.judgeCode });
      return resolve({ ok: true, title: d.title, judgeCode: d.judgeCode, roster: next });
    }
    resolve({ ok: false, error: '알 수 없는 요청입니다.' });
  }, 180));
}

function demoNote() {

}
function levelOf(c, score) {
  if (score == null) return -1;
  for (let i = 0; i < c.bands.length; i++) if (score >= c.bands[i][0] && score <= c.bands[i][1]) return i;
  return -1;
}
function bandGradient(c) {
  const cols = ['var(--lv3)', 'var(--lv2)', 'var(--lv1)', 'var(--lv0)'];
  const bands = c.bands.slice().reverse();
  let from = 0;
  return 'linear-gradient(90deg,' + bands.map((b, i) => {
    const to = i === bands.length - 1 ? 100 : (b[1] + .5) / c.max * 100;
    const stop = cols[i] + ' ' + from + '% ' + to + '%';
    from = to; return stop;
  }).join(',') + ')';
}
function totalOf(scores) { return scores.reduce((s, v) => s + (v || 0), 0); }
function statusOf(t) {
  const k = keyOf(t);
  if (S.drafts[k]) return S.mine[k] ? 'editing' : 'draft';
  return S.mine[k] ? 'done' : 'none';
}
function saveDrafts() { store.set('ssj.drafts.' + S.judge, S.drafts); }
function gradesOf(roster) { return Array.from(new Set(roster.map(t => t.grade))).sort((a, b) => a - b); }

async function enterJudge(judge, code, silent) {
  if (!judge || !code) return viewGate('이름과 심사 코드를 모두 입력해 주세요.');
  S.judge = judge; S.code = code;
  const btn = $('#gGo'); if (btn) { btn.disabled = true; btn.textContent = '확인하는 중'; }
  let out;
  try { out = await api('roster', { judge, code }); }
  catch (e) { return viewGate(e.message); }
  if (!out.ok) { if (out.code === 'BAD_CODE') { S.code = ''; store.del('ssj.session'); } return viewGate(silent && out.code === 'BAD_CODE' ? '' : out.error); }
  store.set('ssj.session', { judge, code });
  S.title = out.title || S.title; S.roster = out.roster || [];
  S.mine = {}; (out.mine || []).forEach(r => { S.mine[recKey(r)] = r; });
  S.drafts = store.get('ssj.drafts.' + judge, {});
  const gs = gradesOf(S.roster);
  if (gs.indexOf(S.grade) < 0) S.grade = gs[0] || null;
  viewList();
}

    '<button class="btn primary" id="submit">' + (was ? '고친 점수 제출' : '점수 제출') + '</button></div></footer>';

  $('#back').onclick = viewList;
  $('#comment').oninput = e => { S.work.comment = e.target.value; keepDraft(); };
  $$('.crit').forEach(sec => {
    const i = Number(sec.dataset.i), c = C[i];
    $$('.lv', sec).forEach(b => { b.onclick = () => setScore(i, c.pick[Number(b.dataset.j)]); });
    $$('.step', sec).forEach(b => { b.onclick = () => setScore(i, S.work.scores[i] + Number(b.dataset.d)); });
    $('.meter', sec).oninput = e => setScore(i, Number(e.target.value));
    paintCrit(i);
  });
  paintTotal();
  $('#submit').onclick = submitScore;
  window.scrollTo(0, 0);
}

function setScore(i, v) {
  const c = C[i];
  S.work.scores[i] = Math.max(0, Math.min(c.max, Math.round(v)));
  paintCrit(i); paintTotal(); keepDraft();
}

function keepDraft() {
  const k = keyOf(S.team), m = S.mine[k], w = S.work;
  const blank = w.scores.every(v => v == null) && !w.comment.trim();
  const same = m && w.scores.every((v, i) => v === m.scores[i]) && w.comment.trim() === (m.comment || '');
  if (blank || same) delete S.drafts[k]; else S.drafts[k] = { scores: w.scores.slice(), comment: w.comment };
  saveDrafts();
}

function paintCrit(i) {
  const sec = $('.crit[data-i="' + i + '"]'), c = C[i], v = S.work.scores[i], lv = levelOf(c, v);
  $('[data-pts]', sec).textContent = v == null ? '–' : v;
  $$('.lv', sec).forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.j) === lv)));
  sec.classList.toggle('picked', v != null);
  if (v != null) sec.classList.remove('missing');
  const meter = $('.meter', sec);
  meter.classList.toggle('unset', v == null);
  if (v != null && Number(meter.value) !== v) meter.value = v;
  const steps = $$('.step', sec);
  steps[0].disabled = v == null || v <= 0;
  steps[1].disabled = v == null || v >= c.max;
  $('[data-hint]', sec).textContent = v == null ? '수준을 고르면 점수가 들어갑니다' : RUBRIC.levels[lv] + ' 구간 ' + c.bands[lv][0] + '–' + c.bands[lv][1] + '점';
}

function paintTotal() {
  const any = S.work.scores.some(v => v != null);
  $('#sum').textContent = any ? totalOf(S.work.scores) : '–';
}

async function submitScore() {
  if (S.busy) return;
  const t = S.team, k = keyOf(t), w = S.work, errBox = $('#scoreErr');
  errBox.innerHTML = '';
  const miss = w.scores.map((v, i) => v == null ? i : -1).filter(i => i >= 0);
  if (miss.length) {
    miss.forEach(i => $('.crit[data-i="' + i + '"]').classList.add('missing'));
    errBox.innerHTML = '<div class="alert err" role="alert">아직 채점하지 않은 항목이 ' + miss.length + '개 있습니다: ' + miss.map(i => esc(C[i].name)).join(', ') + '</div>';
    $('.crit[data-i="' + miss[0] + '"]').scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    return;
  }
  const btn = $('#submit'), label = btn.textContent;
  S.busy = true; btn.disabled = true; btn.textContent = '제출하는 중';
  let out;
  try { out = await api('submit', { judge: S.judge, code: S.code, team: t.id, grade: t.grade, order: t.order, scores: w.scores, comment: w.comment.trim() }); }
  catch (e) { out = { ok: false, error: e.message }; }
  S.busy = false;
  if (!out.ok) {
    btn.disabled = false; btn.textContent = label;
    errBox.innerHTML = '<div class="alert err" role="alert">제출하지 못했습니다. ' + esc(out.error || '') + ' 점수는 이 기기에 남아 있으니 다시 눌러 주세요.</div>';
    errBox.scrollIntoView({ block: 'center' });
    return;
  }
  S.mine[k] = out.record; delete S.drafts[k]; saveDrafts();
  toast('제출했습니다. ' + (t.title || '') + ' ' + totalOf(out.record.scores) + '점');
  const next = S.roster.filter(x => x.grade === t.grade && x.order > t.order && !S.mine[keyOf(x)])[0];
  if (next) openTeam(keyOf(next)); else viewList();
}

function viewAdminGate(err) {
  app.innerHTML = demoNote() + '<div class="gate"><form class="gate-card" id="adminForm">' +
    '<h1 class="gate-title">' + (ROUTE === '#manage' ? '팀 편집' : ROUTE === '#paper' ? '종이 점수 넣기' : '심사 결과') + '</h1><div class="staff" aria-hidden="true"></div>' +
    (err ? '<div class="alert err" role="alert">' + esc(err) + '</div>' : '') +

    '<button class="btn primary" id="aGo">열기</button>' +
    '<p class="gate-foot"><a href="#">채점 화면으로</a></p></form></div>';
  $('#adminForm').onsubmit = e => { e.preventDefault(); S.admin.code = $('#aCode').value.trim(); loadResults(true); };
}

/** pick: 불러올 지난 대회의 보관 이름. '' 이면 지금 대회, 안 주면 보고 있던 것을 다시 불러옵니다. */
async function loadResults(fromGate, pick) {
  const A = S.admin, from = ROUTE;
  const archive = pick === undefined ? (A.arch ? A.arch.label : '') : pick;
  const btn = $('#aGo') || $('#refresh'); if (btn) btn.disabled = true;
  let out;
  try { out = await api('results', archive ? { code: A.code, archive } : { code: A.code }); }
  catch (e) { out = { ok: false, error: e.message }; }
  if (out.ok && archive && out.archive !== archive) out = { ok: false, error: '지난 대회를 보려면 심사 서버의 Code.gs 를 새 파일로 바꿔 다시 배포해야 합니다.' };
  if (!out.ok) {
    if (fromGate || out.code === 'BAD_CODE' || !A.data) { try { sessionStorage.removeItem('ssj.admin'); } catch (e) {} return viewAdminGate(out.error); }
    if (btn) btn.disabled = false;
    const box = $('#resErr'); if (box) box.innerHTML = '<div class="alert err" role="alert">새로 불러오지 못했습니다. ' + esc(out.error || '') + '</div>';
    const sel = $('#pickYear'); if (sel) { sel.disabled = false; sel.value = A.arch ? A.arch.label : ''; }
    return;
  }
  try { sessionStorage.setItem('ssj.admin', A.code); } catch (e) {}
  A.archives = out.archives || [];
  if (archive) A.arch = { label: archive, data: out, agg: aggregate(out.roster, out.records, C) };
  else {
    A.arch = null;
    S.title = out.title || S.title;
    A.data = out; A.at = out.at; A.agg = aggregate(out.roster, out.records, C);
  }
  if (!fromGate && ROUTE !== from) return;       // 기다리는 사이 다른 화면으로 옮겼으면 그 화면을 다시 그리지 않는다
  showAdmin();
}

function showAdmin() {
  if (ROUTE === '#manage') { if (!S.manage || !S.manage.dirty) buildManage(); viewManage(); }
  else if (ROUTE === '#paper') viewPaper();
  else viewResults();
}

function splitMembers(s) {
  let parts = String(s || '').split(/[,，、·\/]+/).map(x => x.trim()).filter(Boolean);
  if (parts.length === 1 && /\s/.test(parts[0])) parts = parts[0].split(/\s+/);
  return parts;
}
function buildManage() {
  const A = S.admin;
  S.manage = {
    title: A.data.title || S.title, judgeCode: A.data.judgeCode || '', grade: (S.manage && S.manage.grade) || 1, dirty: false,
    teams: A.data.roster.map(t => ({ id: t.id, grade: t.grade, title: t.title, members: splitMembers(t.members) }))
  };
}
function manageGrades() {
  return Array.from(new Set([1, 2, 3].concat(S.manage.teams.map(t => t.grade)))).sort((a, b) => a - b);
}
function peopleIn(teams) { return teams.reduce((s, t) => s + t.members.filter(m => m.trim()).length, 0); }

  const paintState = () => {

    if (down) down.onclick = () => { swap(i, rows[n + 1].i); dirty(); viewManage('.m-team[data-i="' + rows[n + 1].i + '"] .m-down:not([disabled]), .m-team[data-i="' + rows[n + 1].i + '"] .m-up'); };

function parsePaste(text, order) {
  return String(text || '').split(/\r?\n/).map(line => {
    const f = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/[,，]/)).map(x => x.trim()).filter(Boolean);
    if (!f.length) return null;
    if (f.length === 1) return { title: f[0], members: [] };
    return order === 'members' ? { title: f[f.length - 1], members: f.slice(0, -1) } : { title: f[0], members: f.slice(1) };
  }).filter(Boolean);
}

const SHEET_ROOM = 134;   // A4 가로 한 쪽에서 팀 줄이 쓸 수 있는 높이(mm). 머리글, 점수 구간, 유의사항을 뺀 나머지.
const SHEET_MAX = 15;     // 한 쪽에 넣는 팀 수의 한도. 넘으면 쪽을 고르게 나눕니다.

/** 종이 채점표 한 벌(한 학년, 채점관 한 명)의 쪽들. 팀 수에 맞춰 줄 높이를 정해 쪽마다 꼭 한 장에 들어가게 합니다. */
function sheetPages(title, grade, teams, judge) {
  const parts = Math.max(1, Math.ceil(teams.length / SHEET_MAX)), size = Math.ceil(teams.length / parts) || 1;
  const rowH = Math.max(8.5, Math.min(16, Math.floor(SHEET_ROOM / size * 2) / 2));
  const out = [];
  for (let p = 0; p < parts; p++) out.push(sheetPage(title, grade, teams.slice(p * size, (p + 1) * size), judge, rowH, parts > 1 ? (p + 1) + ' / ' + parts + '쪽' : ''));
  return out;
}
function sheetPage(title, grade, teams, judge, rowH, pageNo) {
  return '<section class="sheet-page' + (rowH < 12.5 ? ' tight' : '') + '" style="--row:' + rowH + 'mm">' +
    '<header class="sp-head"><h1>' + esc(title) + ' <b>' + grade + '학년</b> 채점표' + (pageNo ? ' <small>' + pageNo + '</small>' : '') + '</h1>' +
    '<p class="sp-judge">채점관 <span>' + esc(judge) + '</span> 서명 <span></span></p></header>' +
    '<table class="sp"><colgroup><col class="c-no"><col class="c-title">' + C.map(() => '<col class="c-sc">').join('') + '<col class="c-sc"><col></colgroup>' +
    '<thead><tr><th>순서</th><th>곡 제목 / 팀원</th>' + C.map(c => '<th>' + esc(c.name) + '<b>' + c.max + '점</b></th>').join('') +
    '<th>총점<b>' + MAX_TOTAL + '점</b></th><th>한줄평</th></tr>' +
    RUBRIC.levels.map((l, j) => '<tr class="band"><th colspan="2">' + esc(l) + '</th>' +
      C.map(c => '<td>' + c.bands[j][0] + '–' + c.bands[j][1] + '</td>').join('') +
      (j === 0 ? '<td rowspan="' + RUBRIC.levels.length + '">다섯 항목의 합</td><td rowspan="' + RUBRIC.levels.length + '">좋았던 점, 아쉬운 점</td>' : '') + '</tr>').join('') +
    '</thead><tbody>' + teams.map(t => '<tr><td class="sp-no">' + t.order + '</td><td class="t"><b>' + esc(t.title || '(제목 없음)') + '</b><small>' + esc(t.members) + '</small></td>' +

/** 인쇄할 채점표를 만들어 인쇄 영역에 넣습니다. 채점관마다 고른 학년을 한 벌씩. */
function buildSheets(grades, judges) {
  const A = S.admin, roster = A.data.roster, pages = [];
  judges.forEach(j => grades.forEach(g => { sheetPages(A.data.title || S.title, g, roster.filter(t => t.grade === g), j).forEach(p => pages.push(p)); }));
  $('#printArea').innerHTML = pages.join('');
  document.body.classList.add('print-sheet');
  let st = $('#sheetPageStyle');
  if (!st) { st = document.createElement('style'); st.id = 'sheetPageStyle'; document.head.appendChild(st); }
  st.textContent = '@page { size: A4 landscape; margin: 9mm 10mm; }';
  return pages.length;
}
function clearSheets() {
  document.body.classList.remove('print-sheet');
  $('#printArea').innerHTML = '';
  const st = $('#sheetPageStyle'); if (st) st.remove();
}
function printSheets(grades, judges) {
  buildSheets(grades, judges);
  const done = () => { window.removeEventListener('afterprint', done); clearSheets(); };
  window.addEventListener('afterprint', done);
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(() => window.print());   // 글꼴이 늦게 붙으면 줄 수가 달라져 쪽이 밀립니다
}

/* ---------- 관리자: 종이 점수 넣기 ---------- */

const PAPER_STATE = { empty: '', saved: '저장됨', fresh: '저장 전', changed: '고침 · 저장 전', partial: '덜 채움', wrong: '점수 확인' };
const oneLine = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();

/** 그 채점관이 이미 낸 점수 (팀별로 가장 최근 것) */
function savedOf(judge) {
  const map = {};
  S.admin.data.records.forEach(r => {
    if (oneLine(r.judge) !== judge) return;
    const k = recKey(r);
    if (!map[k] || String(r.at || '') >= String(map[k].at || '')) map[k] = r;
  });
  return map;
}
/** 그 채점관의 입력 표. 처음 열 때는 이미 낸 점수로 채워 둡니다. */
function paperSet(judge) {
  const P = S.paper;
  if (!P.sets[judge]) {
    const saved = savedOf(judge), set = {};
    Object.keys(saved).forEach(k => { set[k] = { scores: saved[k].scores.map(String), comment: saved[k].comment || '' }; });
    P.sets[judge] = set;
  }
  return P.sets[judge];
}
/** 한 팀의 입력 상태: empty(빈 줄) kept(지웠지만 저장된 점수 유지) saved fresh changed partial wrong */
function paperRow(set, saved, t) {
  const k = keyOf(t), w = set[k], old = saved[k];
  const vals = C.map((c, i) => w ? oneLine(w.scores[i]) : '');
  const comment = w ? oneLine(w.comment) : '';
  const bad = vals.map((v, i) => v !== '' && !(/^\d{1,2}$/.test(v) && Number(v) <= C[i].max));
  const miss = vals.map(v => v === '');
  const full = !bad.some(Boolean) && !miss.some(Boolean);
  const nums = full ? vals.map(Number) : null;
  let state;
  if (miss.every(Boolean) && !comment) state = old ? 'kept' : 'empty';
  else if (bad.some(Boolean)) state = 'wrong';
  else if (!full) state = 'partial';
  else if (old && nums.every((v, i) => v === Number(old.scores[i])) && comment === oneLine(old.comment)) state = 'saved';
  else state = old ? 'changed' : 'fresh';
  return { key: k, team: t, comment, bad, miss, nums, state, total: nums ? totalOf(nums) : null };
}
function paperRows(judge) {
  const set = S.paper.sets[judge] || {}, saved = savedOf(judge);
  return S.admin.data.roster.map(t => paperRow(set, saved, t));
}
function paperDirty() {
  return !!S.paper && Object.keys(S.paper.sets).some(j => paperRows(j).some(r => ['fresh', 'changed', 'partial', 'wrong'].indexOf(r.state) >= 0));
}
function mergeRecords(recs) {
  const A = S.admin;
  (recs || []).forEach(rec => {
    A.data.records = A.data.records.filter(r => !(recKey(r) === recKey(rec) && oneLine(r.judge) === oneLine(rec.judge)));
    A.data.records.push(rec);
  });
  A.agg = aggregate(A.data.roster, A.data.records, C);
}

  const set = P.judge ? paperSet(P.judge) : {};
  const had = P.judge ? Object.keys(savedOf(P.judge)).length : 0;
  const names = Array.from(new Set(A.agg.judges.map(j => j.judge).concat(Object.keys(P.sets)))).sort();

  app.innerHTML = demoNote() + '<div class="wrap wide paper">' +
    '<header class="top"><div><h1>종이 점수 넣기</h1><p>종이 채점표에 적힌 점수를 채점관별로 옮겨 넣습니다. 온라인 점수와 함께 집계됩니다.</p></div>' +
    '<div class="top-actions"><button class="btn" id="pSheet">종이 채점표</button><a class="btn" href="#result">결과 보기</a></div></header><div id="pErr"></div>' +
    (!gs.length ? '<p class="empty">아직 등록된 팀이 없습니다. <a href="#manage">팀 편집</a>에서 팀을 넣어 주세요.</p>' :
    '<section class="grade-block"><form class="paper-judge" id="pForm"><label class="field"><span>채점관 이름</span>' +
    '<input id="pJudge" list="pNames" maxlength="20" autocomplete="off" placeholder="종이에 적힌 이름" value="' + esc(P.judge) + '">' +
    '<datalist id="pNames">' + names.map(n => '<option value="' + esc(n) + '">').join('') + '</datalist></label>' +
    '<p>' + (!P.judge ? '이름을 적고 Enter 를 누르면 입력 표가 열립니다. 온라인으로 채점한 사람과 같은 이름을 쓰면 같은 사람으로 집계됩니다.'
      : had ? '이 이름으로 이미 ' + had + '팀의 점수가 들어와 있습니다. 표에 그 점수가 채워져 있고, 고쳐서 저장하면 덮어씁니다.'
      : '새 채점관입니다. 다른 채점관의 종이를 넣으려면 이름을 바꿔 적으면 됩니다. 넣던 점수는 저장할 때까지 남아 있습니다.') + '</p></form></section>' +
    (P.judge ? '<section class="grade-block"><nav class="grades" role="tablist" aria-label="학년">' + gs.map(g =>
      '<button role="tab" aria-selected="' + (g === P.grade) + '" data-g="' + g + '">' + g + '학년<small class="num" data-filled="' + g + '"></small></button>').join('') + '</nav>' +
      '<div class="scroll-x"><table class="entry"><thead><tr><th>순서</th><th class="l">곡 제목과 팀원</th>' +
      C.map(c => '<th>' + esc(c.short) + '<small>' + c.max + '점</small></th>').join('') + '<th>총점</th><th class="l">한줄평</th><th>상태</th></tr></thead><tbody>' +
      teams.map(t => {
        const k = keyOf(t), w = set[k] || { scores: [], comment: '' };
        return '<tr data-k="' + esc(k) + '"><td><span class="no">' + t.order + '</span></td><td class="l title"><b>' + esc(t.title || '(제목 없음)') + '</b><small>' + esc(t.members) + '</small></td>' +
          C.map((c, i) => '<td><input class="sc" data-i="' + i + '" inputmode="numeric" autocomplete="off" maxlength="2" aria-label="' + t.order + '번 팀 ' + esc(c.name) + ', ' + c.max + '점 만점" value="' + esc(w.scores[i] == null ? '' : w.scores[i]) + '"></td>').join('') +
          '<td class="tot num" data-tot></td><td class="l"><input class="cm" maxlength="300" autocomplete="off" aria-label="' + t.order + '번 팀 한줄평" value="' + esc(w.comment || '') + '"></td><td class="state" data-state></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="entry-hint">숫자를 치고 Tab 이나 Enter 로 다음 칸으로 갑니다. 더 칠 숫자가 없으면 저절로 넘어갑니다. ↑↓ 키는 위아래 팀으로 옮깁니다. 총점이 종이에 적힌 총점과 같은지 확인해 주세요.</p></section>' : '')) +
    '</div><footer class="bar paper-bar"><div class="bar-in"><p id="pState"></p><div class="bar-btns"><button class="btn primary" id="pSave">저장</button></div></div></footer>';

  const saved = P.judge ? savedOf(P.judge) : {};
  const rowOf = tr => paperRow(set, saved, roster.find(t => keyOf(t) === tr.dataset.k));
  const paintRow = tr => {
    const r = rowOf(tr), strictMiss = P.strict && r.state === 'partial';
    $$('.sc', tr).forEach((inp, i) => inp.classList.toggle('bad', r.bad[i] || (strictMiss && r.miss[i])));
    $('[data-tot]', tr).textContent = r.total == null ? '–' : r.total;
    $('[data-state]', tr).textContent = r.state === 'kept' ? '저장된 ' + totalOf(saved[r.key].scores) + '점 유지' : PAPER_STATE[r.state];
    tr.className = r.state === 'saved' ? 'saved' : (r.state === 'wrong' || strictMiss) ? 'wrong' : (r.state === 'empty' || r.state === 'kept') ? '' : 'changed';
  };
  const paintBar = () => {
    const rows = P.judge ? roster.map(t => paperRow(set, saved, t)) : [];
    const todo = rows.filter(r => r.state === 'fresh' || r.state === 'changed').length;
    const stuck = rows.filter(r => r.state === 'partial' || r.state === 'wrong').length;
    $('#pState').textContent = !P.judge ? '채점관 이름을 먼저 적어 주세요'
      : todo || stuck ? P.judge + ' 채점관: 저장하지 않은 점수 ' + todo + '팀' + (stuck ? ', 덜 채운 줄 ' + stuck + '팀' : '') : P.judge + ' 채점관: 모두 저장되어 있습니다';
    $('#pSave').disabled = !(todo || stuck);
    gs.forEach(g => {
      const el = $('[data-filled="' + g + '"]'), inG = rows.filter(r => r.team.grade === g);
      if (el) el.textContent = '입력 ' + inG.filter(r => ['saved', 'fresh', 'changed', 'kept'].indexOf(r.state) >= 0).length + ' / ' + inG.length + '팀';
    });
  };
  const move = (inp, step) => { const all = $$('.entry input'), to = all[all.indexOf(inp) + step]; if (to) { to.focus(); to.select(); } };

  $('#pSheet').onclick = openSheetDlg;
  $('#pSave').onclick = savePaper;
  const form = $('#pForm');
  if (form) {
    const pick = () => {
      const name = cleanName($('#pJudge').value);
      if (name === P.judge) return;
      P.judge = name; P.strict = false;
      viewPaper(name ? '.entry input.sc' : '#pJudge');
    };
    form.onsubmit = e => { e.preventDefault(); pick(); };
    $('#pJudge').onchange = pick;
  }
  $$('.grades button').forEach(b => { b.onclick = () => { P.grade = Number(b.dataset.g); viewPaper('.entry input.sc'); }; });
  const body = $('.entry tbody');
  if (body) {
    $$('tr', body).forEach(paintRow);
    body.addEventListener('input', e => {
      const inp = e.target, tr = inp.closest('tr');
      const w = set[tr.dataset.k] || (set[tr.dataset.k] = { scores: C.map(() => ''), comment: '' });
      if (inp.classList.contains('sc')) {
        const i = Number(inp.dataset.i), v = inp.value.replace(/\D/g, '').slice(0, 2);
        if (v !== inp.value) inp.value = v;
        w.scores[i] = v;
        paintRow(tr); paintBar();
        // 두 자리를 쳤거나, 뒤에 어떤 숫자를 붙여도 배점을 넘는 숫자면 다음 칸으로
        if (v !== '' && Number(v) <= C[i].max && (v.length === 2 || v === '0' || Number(v) * 10 > C[i].max)) move(inp, 1);
      } else { w.comment = inp.value; paintRow(tr); paintBar(); }
    });
    body.addEventListener('keydown', e => {
      const inp = e.target;
      if (inp.tagName !== 'INPUT' || e.isComposing) return;
      if (e.key === 'Enter') { e.preventDefault(); move(inp, 1); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const tr = inp.closest('tr'), next = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling;
        if (!next) return;
        e.preventDefault();
        const to = inp.classList.contains('sc') ? $('.sc[data-i="' + inp.dataset.i + '"]', next) : $('.cm', next);
        to.focus(); to.select();
      }
    });
  }
  paintBar();
  if (focusSel) { const el = $(focusSel); if (el) { el.focus(); if (el.select) el.select(); } }
}

async function savePaper() {
  const A = S.admin, P = S.paper, judge = P.judge, box = $('#pErr');
  if (S.busy || !judge) return;
  box.innerHTML = '';
  const rows = paperRows(judge);
  const stuck = rows.filter(r => r.state === 'partial' || r.state === 'wrong');
  if (stuck.length) {
    P.strict = true; P.grade = stuck[0].team.grade;
    viewPaper();
    $('#pErr').innerHTML = '<div class="alert err" role="alert">점수를 확인해 주세요: ' + stuck.map(r => esc(r.team.grade + '학년 ' + r.team.order + '번')).join(', ') +
      '. 다섯 항목을 모두 채우고 배점을 넘지 않아야 합니다. 아직 채점하지 않은 팀은 줄 전체를 비워 두면 됩니다.</div>';
    const first = $('.entry input.bad'); if (first) { first.focus(); first.select(); }
    return;
  }
  const items = rows.filter(r => r.state === 'fresh' || r.state === 'changed')
    .map(r => ({ team: r.team.id, grade: r.team.grade, order: r.team.order, scores: r.nums, comment: r.comment }));
  if (!items.length) return;
  const btn = $('#pSave');
  S.busy = true; btn.disabled = true; btn.textContent = '저장하는 중';
  let out;
  try {
    out = await api('submitBatch', { code: A.code, judge, items });
    // 심사 서버가 옛 Code.gs 이면 한꺼번에 저장하는 요청을 모릅니다. 그때는 한 팀씩 차례로 보냅니다.
    if (!out.ok && out.code === 'BAD_REQUEST') out = await savePaperEach(judge, items, btn);
  } catch (e) { out = { ok: false, error: e.message }; }
  S.busy = false;
  mergeRecords(out.records);
  if (!out.ok) {
    viewPaper();
    $('#pErr').innerHTML = '<div class="alert err" role="alert">저장하지 못했습니다. ' + esc(out.error || '') +
      (out.records && out.records.length ? ' ' + out.records.length + '팀까지는 저장되었습니다.' : '') + ' 입력한 점수는 화면에 남아 있으니 다시 눌러 주세요.</div>';
    $('#pErr').scrollIntoView({ block: 'center' });
    return;
  }
  delete P.sets[judge]; P.strict = false;
  viewPaper();
  toast(judge + ' 채점관의 ' + items.length + '팀 점수를 저장했습니다.');
}

async function savePaperEach(judge, items, btn) {
  const A = S.admin, done = [];
  for (let i = 0; i < items.length; i++) {
    btn.textContent = '저장하는 중 ' + (i + 1) + ' / ' + items.length;
    let out;
    try { out = await api('submit', Object.assign({ judge, code: A.data.judgeCode }, items[i])); }
    catch (e) { out = { ok: false, error: e.message }; }
    if (!out.ok) return { ok: false, error: out.error, records: done };
    done.push(out.record);
  }
  return { ok: true, saved: done.length, records: done };
}

    '<label class="check"><input type="checkbox" id="yKeep"> <span>팀 목록은 그대로 두고 점수만 비우기<small>시험 채점을 지우고 본 심사를 시작할 때 고릅니다.</small></span></label>' +

    '<p class="entry-hint">심사 코드와 관리자 코드는 그대로입니다. 심사 코드는 팀 편집의 대회 설정에서 바꿀 수 있습니다.</p></div>';

/* ---------- 발표 화면 ---------- */

function openStage() {
  const V = S.admin.arch || S.admin, agg = V.agg, stageTitle = S.admin.arch ? V.data.title : S.title;
  const grades = Object.keys(agg.grades).map(Number).sort((a, b) => a - b).map(g => agg.grades[g]).filter(g => g.scored > 0);
  if (!grades.length) return toast('아직 발표할 점수가 없습니다.');
  const steps = [{ type: 'open' }];
  grades.forEach(g => {
    const first = g.teams.filter(t => t.rank === 1), second = g.teams.filter(t => t.rank === 2);
    steps.push({ type: 'grade', g });
    if (second.length) steps.push({ type: 'award', g, place: 2, teams: second, shown: false });
    steps.push({ type: 'award', g, place: 1, teams: first, shown: false });
  });
  steps.push({ type: 'end', grades });

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = document.createElement('div');
  el.className = 'stage'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', '수상 발표 화면'); el.tabIndex = -1;
  el.innerHTML = '<div class="stage-lines"></div><canvas></canvas>' +
    '<div class="stage-top"><span>' + esc(stageTitle) + '</span><span><label><input type="checkbox" id="showScore" checked> 점수 보이기</label> <button id="closeStage">닫기</button></span></div>' +
    '<div class="stage-mid" aria-live="polite"></div>' +
    '<div class="stage-foot"><span id="stagePos"></span><span>화면을 누르거나 → 키로 다음, ← 키로 이전, Esc 로 닫기</span></div>';
  document.body.appendChild(el);
  const mid = $('.stage-mid', el), canvas = $('canvas', el);
  let at = 0, shuffleTimer = 0, raf = 0;

  const teamHtml = (t, showScore) => '<div class="s-team"><p class="s-title pop">' + esc(t.title) + '</p><p class="s-members rise">' + esc(t.members) + '</p>' +
    (showScore ? '<p class="s-score rise">평균 ' + f2(t.totalAvg) + '점</p>' : '') + '</div>';

  function paint() {
    clearInterval(shuffleTimer); stopConfetti();
    const s = steps[at], showScore = $('#showScore', el).checked;
    $('#stagePos', el).textContent = (at + 1) + ' / ' + steps.length;
    if (s.type === 'open') {
      mid.innerHTML = '<div><p class="s-title rise">' + esc(stageTitle) + '</p><p class="s-sub">수상 발표</p></div>';
    } else if (s.type === 'grade') {
      mid.innerHTML = '<div><p class="s-grade pop">' + s.g.grade + '학년</p><p class="s-sub">' + s.g.scored + '팀이 무대에 올랐습니다</p></div>';
    } else if (s.type === 'award') {
      const label = (s.teams.length > 1 ? '공동 ' : '') + s.place + '등';
      const head = '<p class="s-label ' + (s.place === 2 ? 'second' : '') + '">' + s.g.grade + '학년 ' + label + '</p>';
      if (!s.shown) {
        const titles = s.g.teams.filter(t => t.n > 0).map(t => t.title);
        mid.innerHTML = '<div>' + head + '<p class="s-title shuffle" id="shuf">' + (still ? '?' : esc(titles[0])) + '</p><p class="s-sub">누구일까요</p></div>';
        if (!still && titles.length > 1) { let i = 0; shuffleTimer = setInterval(() => { i = (i + 1) % titles.length; const n = $('#shuf', el); if (n) n.textContent = titles[i]; }, 95); }
      } else {
        mid.innerHTML = '<div class="' + (s.teams.length > 1 ? 'multi' : '') + '">' + head + s.teams.map(t => teamHtml(t, showScore)).join('') + '</div>';
        if (s.place === 1 && !still) confetti();
      }
    } else {
      const cell = (ts, place) => ts.map(t => '<div class="s-cell"><em class="' + (place === 2 ? 'second' : '') + '">' + esc(t.award) + '</em><b>' + esc(t.title) + '</b><small>' + esc(t.members) + '</small></div>').join('');
      mid.innerHTML = '<div><p class="s-label">모두 수고했습니다</p><div class="s-board rise">' + s.grades.map(g =>
        '<div class="s-row"><span class="g">' + g.grade + '학년</span><div>' + cell(g.teams.filter(t => t.rank === 1), 1) + '</div><div>' + cell(g.teams.filter(t => t.rank === 2), 2) + '</div></div>').join('') + '</div></div>';
    }
  }
  function next() { const s = steps[at]; if (s.type === 'award' && !s.shown) { s.shown = true; paint(); } else if (at < steps.length - 1) { at++; paint(); } }
  function prev() { const s = steps[at]; if (s.type === 'award' && s.shown) { s.shown = false; paint(); } else if (at > 0) { at--; paint(); } }
  function close() {
    clearInterval(shuffleTimer); stopConfetti(); document.removeEventListener('keydown', onKey);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    el.remove();
  }
  function onKey(e) {
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  }
  function stopConfetti() { cancelAnimationFrame(raf); const c = canvas.getContext('2d'); c.clearRect(0, 0, canvas.width, canvas.height); }
  function confetti() {
    const w = canvas.width = el.clientWidth, h = canvas.height = el.clientHeight, c = canvas.getContext('2d');
    const cols = ['#F3B824', '#FFFFFF', '#7FA2FF', '#39C6A8', '#FF8E7A'];
    const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * w, y: -20 - Math.random() * h * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
    const t0 = performance.now();
    (function tick(now) {
      c.clearRect(0, 0, w, h);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03; p.r += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore(); });
      if (now - t0 < 6000) raf = requestAnimationFrame(tick); else c.clearRect(0, 0, w, h);
    })(t0);
  }

  el.onclick = e => { if (e.target.closest('.stage-top')) return; next(); };
  $('#closeStage', el).onclick = close;
  $('#showScore', el).onchange = paint;
  document.addEventListener('keydown', onKey);
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  el.focus();
  paint();
}

/* ---------- 시작 ---------- */

let ROUTE = '';   // '', '#result', '#manage', '#paper'
const ADMIN_ROUTES = ['#result', '#manage', '#paper'];

function route() {
  if (!GAS) ROUTE = location.hash;
  clearInterval(S.admin.timer); S.admin.timer = 0;
  const st = $('.stage'); if (st) st.remove();
  ['#rubricDlg', '#pasteDlg', '#sheetDlg', '#yearDlg'].forEach(id => { const d = $(id); if (d.open) d.close(); });
  if (ADMIN_ROUTES.indexOf(ROUTE) >= 0) {
    if (ROUTE !== '#result') S.admin.arch = null;            // 지난 대회는 결과 화면에서만 본다
    if (S.admin.data && S.admin.code) {                      // 이미 불러온 자료가 있으면 바로 보여 주고, 결과 화면은 새로 받아 온다
      showAdmin();
      if (ROUTE === '#result') loadResults(false);
      return;
    }
    let saved = ''; try { saved = sessionStorage.getItem('ssj.admin') || ''; } catch (e) {}
    if (saved) { S.admin.code = saved; app.innerHTML = '<p class="empty">불러오는 중</p>'; loadResults(true); } else viewAdminGate();
    return;
  }
  ROUTE = '';
  const sess = store.get('ssj.session', null);
  if (sess && sess.judge && sess.code) { S.judge = sess.judge; S.code = sess.code; viewGate(); enterJudge(sess.judge, sess.code, true); }
  else viewGate();
}
window.addEventListener('beforeunload', e => { if ((S.manage && S.manage.dirty) || paperDirty()) { e.preventDefault(); e.returnValue = ''; } });

if (GAS) {
  // Apps Script 화면은 틀(iframe) 안에서 열려 주소의 # 을 직접 쓸 수 없으므로, 화면 안의 이동은 직접 처리한다.
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    ROUTE = a.getAttribute('href') === '#' ? '' : a.getAttribute('href');
    try { google.script.history.replace(null, {}, ROUTE.slice(1)); } catch (err) {}
    route();
  });
  const start = loc => {
    const view = loc && (loc.hash || (loc.parameter && loc.parameter.view) || '');
    ROUTE = ADMIN_ROUTES.indexOf('#' + view) >= 0 ? '#' + view : '';
    route();
  };
  try { google.script.url.getLocation(start); } catch (err) { start(null); }
} else {
  window.addEventListener('hashchange', route);
  route();
}
</script>
